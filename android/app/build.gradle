plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.ecosensetest"
    compileSdk = 35 // تحديد صريح لدعم WorkManager

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.ecosensetest"
        minSdk = 23 // مطلوب لـ WorkManager
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: أضف إعدادات التوقيع الخاصة بك للبناء الإصداري.
            // استخدام مفاتيح التصحيح مؤقتًا لتشغيل `flutter run --release`.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {

    // إضافة Kotlin standard library
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
}

flutter {
    source = "../.."
}